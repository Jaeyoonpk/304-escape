version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - BASE_URL=${BASE_URL}
      - GMS_KEY=${GMS_KEY}
      - API_MODEL=${API_MODEL}
    volumes:
      - ./chroma_store:/app/chroma_store
      - ./.env:/app/.env
    restart: always